
<!DOCTYPE html>

  <!-- UI5 Bootstrap --><script id="sap-ui-bootstrap" src="https://sdk.openui5.org/resources/sap-ui-core.js"

  <!-- Custom CSS for fading header -->
  <style>
    body {
      background-color: black;
      margin: 0;
      color: white;
    }
  
    .myTightGrid.sapMBtn {
      margin: 0 !important;
      padding: 0 !important;
      border-radius: 0 !important;
      /* optional: remove rounded corners */
    }
  
    @keyframes fadeInButton {
      from {
        opacity: 0.1;
        transform: translateY(5px);
      }
  
      to {
        opacity: 0.5;
        transform: translateY(0);
      }
    }
  
    .userGuideBtn {
      position: absolute;
      bottom: 15px;
      right: 20px;
      z-index: 3;
  
      background: transparent;
      color: white;
      border: none;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      opacity: 0;
      /* start hidden */
      animation: fadeInButton 10s forwards;
    }
  
    .userGuideBtn:hover {
      text-decoration: underline;
    }
  
  
    .fading-header {
      font-size: 2rem;
      text-align: center;
      padding: 50px;
      background-image: url('img/tracker.jpg');
      background-size: cover;
      background-position: center;
      position: relative;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
  
    .fading-background {
      position: absolute;
      inset: 0;
      animation: fadeInBackground 10s forwards;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: 1;
    }
  
    .linkPadding {
      padding: 0 9px;
      /* horizontal padding around each link */
    }
  
    @keyframes fadeInBackground {
      to {
        background-color: rgba(0, 0, 0, 0.5);
      }
    }
  
    .fading-header h1,
    .fading-header .description {
      position: relative;
      z-index: 2;
    }
  
    .fading-header h1 {
      font-size: 2rem;
    }
  
    .description {
      margin-top: 20px;
      font-size: 1.8rem;
    }
  
    h2.cmsSubtitle {
      font-size: 2rem;
      font-weight: 600;
      margin: 1rem 0;
      color: #fff;
    }
  
    .configLabel {
      font-size: 1.2rem;
      margin-top: 1rem;
      color: #ccc;
    }
  
    .statusText {
      font-size: 1rem;
      margin-top: 1rem;
      color: #ccc;
    }
  
    .listSpacing {
      padding-bottom: 14px !important;
      /* optional padding inside */
    }
  
  
    .sapUiBody {
      padding: 0 !important;
    }
  </style>
  </head>
  
  <body>
    <div id="content"></div>
        
<script>
sap.ui.getCore().attachInit(function () {

  // =========================
  // Header (unchanged)
  // =========================
  var oHeader = new sap.ui.core.HTML({
    content: `
      <div class="fading-header">
        <div class="fading-background"></div>

        <button class="userGuideBtn"
          onclick="window.open('https://github.com/alja/FireworksWeb/blob/main/doc/UserGuide.md','_blank')">
          UserGuide
        </button>

        <h2>cmsShowWeb Service @ CERN</h2>
        <p>MARK.<br>Hi TestUser, please choose your action below.</p>
      </div>
    `
  });

  // =========================
  // PREDEFINED VALUES
  // =========================
  const PREDEFINED = {
    // file: [{"/eos/user/a/amraktad/Fireworks-Test/test.root"}],
    geo: ["/eos/user/a/amraktad/geo/cmsGeomRun1.root", "/eos/user/a/amraktad/geo/cmsGeomRun2.root", "/eos/user/a/amraktad/geo/cmsGeom2021.root", "cmsRecoGeom-2026_D77.root"],
    simgeo: ["/eos/user/a/amraktad/geo/cmsSimGeomRun1.root", "/eos/user/a/amraktad/geo/cmsSimGeomRun2.root", "/eos/user/a/amraktad/geo/cmsSimGeo2026.root"]
  };

  // =========================
  // HISTORY HELPERS
  // =========================
  function getHistory(key) {
    return JSON.parse(localStorage.getItem(key) || "[]");
  }

  function addToHistory(key, value) {
    let history = getHistory(key);

    history = history.filter(v => v !== value);
    history.unshift(value);
    history = history.slice(0, 10);

    localStorage.setItem(key, JSON.stringify(history));
  }
  
  function buildSuggestionData(value, key) {
    return getHistory(key)
      .filter(v => v.toLowerCase().includes((value || "").toLowerCase()))
      .map(v => ({ text: v }));
  }

  // =========================
  // BUILD COMBO DATA
  // =========================
  function buildComboData(inputValue, historyKey, predefinedList) {
    const sValue = (inputValue || "").toLowerCase();

    const merged = [...new Set([
      ...getHistory(historyKey),
      ...predefinedList
    ])];

    return merged
      .filter(v => v.toLowerCase().includes(sValue))
      .map(v => ({ key: v, text: v }));
  }
 

  // =========================
  // MODEL
  // =========================

const oHistoryModel = new sap.ui.model.json.JSONModel({
   // fileItems: buildComboData("", "inputHistory", PREDEFINED.file),
    fileHist: getHistory("inputHistory").map(v => ({ text: v })),
    configHist: getHistory("inputConfigHistory").map(v => ({ text: v })),
    geoItems: buildComboData("", "inputGeoHistory", PREDEFINED.geo),
    simGeoItems: buildComboData("", "inputSimGeoHistory", PREDEFINED.simgeo)
  });

  oHistoryModel.setProperty(
  "/fileHist",
  getHistory("inputHistory").map(x => ({ text: x }))
);

const oInputHistoryModel = new sap.ui.model.json.JSONModel({
  fileHistory: []
});
oInputHistoryModel.setData({
  fileHistory: getHistory("inputHistory").map(v => ({ text: v }))
});
  // =========================
  // GENERIC COMBOBOX FACTORY
  // =========================
  function createComboBox(id, placeholder, modelPath, historyKey, predefinedList) {
    let oCombo = new sap.m.ComboBox({
      id: id,
      placeholder: placeholder,
      width: "100%",
      editable: true,

      items: {
        path: modelPath,
        template: new sap.ui.core.ListItem({
          key: "{key}",
          text: "{text}",
          icon: {
            path: "text",
            formatter: function (v) {
              if (v.startsWith("/eos")) return "sap-icon://cloud";
              if (v.startsWith("/store")) return "sap-icon://database";
              if (v.endsWith(".py")) return "sap-icon://document-text";
              return "sap-icon://document";
            }
          }
        })
      },
      // 💾 store history
      change: function (oEvent) {
        const value = oEvent.getParameter("value");
        if (value) {
          addToHistory(historyKey, value);
        }
      }
    });

    oCombo.attachEvent("input", function (oEvent) {
    const value = oEvent.getParameter("value");

    oHistoryModel.setProperty(
      modelPath,
      buildComboData(value, historyKey, predefinedList)
    );
    });


    return oCombo;

  }

  // =========================
  // INPUT FACTORY
  // =========================
 function createInput(id, path, histKey) {
  const inp = new sap.m.Input({
    id: id,
    width: "100%",
    showSuggestion: true,
    startSuggestion: 0, // show immediately

    suggestionItems: {
      path: path,
      template: new sap.ui.core.Item({ text: "{text}" })
    },

    // 🔍 ALWAYS read from localStorage
    suggest: function (e) {
      const v = e.getParameter("suggestValue") || "";

      const data = getHistory(histKey)
        .filter(x => x.toLowerCase().includes(v.toLowerCase()))
        .map(x => ({ text: x }));

      oHistoryModel.setProperty(path, data);
    },
    // 💾 Save + refresh from storage
    change: function (e) {
      const v = e.getParameter("value");

      if (v) {
        addToHistory(histKey, v);

        // reload FULL history from localStorage
        const data = getHistory(histKey).map(x => ({ text: x }));
        oHistoryModel.setProperty(path, data);
      }
    }
  });

  inp.setModel(oInputHistoryModel);
  return inp;
}

  // =========================
  // INPUTS (ComboBoxes)
  // =========================
  /*
  const fileInput = createComboBox(
    "fileInput",
    "Enter file name(s), separated by spaces",
    "/fileItems",
    "inputHistory",
    PREDEFINED.file
  );*/

 const fileInput = createInput("fileInput", "/fileHistory", "inputHistory");

 console.log(localStorage.getItem("inputHistory"));
 for (let i = 0; i < localStorage.length; i++) {
  const key = localStorage.key(i);
  console.log(key, JSON.parse(localStorage.getItem(key)));
}

  const configInput = createInput("pathConfiguration", "/configHist", "inputConfigHistory");

  const geoInput = createComboBox(
    "pathGeometry",
    "EOS path to geometry file",
    "/geoItems",
    "inputGeoHistory",
    PREDEFINED.geo
  );

  const simGeoInput = createComboBox(
    "pathSimGeo",
    "EOS path to simulation geometry file",
    "/simGeoItems",
    "inputSimGeoHistory",
    PREDEFINED.simgeo
  );
var oRadioGroup = new sap.m.RadioButtonGroup({
        columns: 2,           // horizontal layout
        selectedIndex: 0,
        buttons: [
            new sap.m.RadioButton({ text: "CMSSW_17_X data or older" }),
            new sap.m.RadioButton({ text: "CMSSW_20_X"})
        ],
        select: function(oEvent) {
            var idx = oEvent.getParameter("selectedIndex");
            console.log("Selected:", idx);
        }
    });
  // attach model
  fileInput.setModel(oHistoryModel);
  configInput.setModel(oHistoryModel);
  geoInput.setModel(oHistoryModel);
  simGeoInput.setModel(oHistoryModel);

  // =========================
  // LEFT PANEL
  // =========================
  var oLeftVBox = new sap.m.VBox({

          items: [
            new sap.ui.core.HTML({ content: '<h2 class="cmsSubtitle">Open Event Display</h2>' }),
            
            fileInput,
            oRadioGroup,
            new sap.m.List({
              id: "LoadAct",
              inset: false,
              items: [
                { label: "Load File EOS", action: "EOS", desc: "Open CERN EOS LFN (/store/...) or PFN (/eos/...)", tooltip: "", icon: "img/eos-logo.png" },
                { label: "Load File AAA", action: "AAA", desc: "Open AAA LFN (/store/...) via the regional EU redirector (falls back to global / US if the file is not found in the EU)", tooltip: "", icon: "img/xroot-logo.png" }
              ].map(function (item) {
                return new sap.m.StandardListItem({
                  title: item.label,
                  tooltip: item.tooltip,
                  description: item.desc || "",
                  info: item.action,
                  tooltip: item.tooltip,
                  icon: item.icon,
                  type: "Active",
                  press: function () {
                    let path = "https://MACHINE/cmsShowWeb/revetor-frontend.pl?load_file=";
                    let fileInput = sap.ui.getCore().byId("fileInput");
                    let configInput = sap.ui.getCore().byId("pathConfiguration");
                    let geometryInput = sap.ui.getCore().byId("pathGeometry");
                    let simGeoInput = sap.ui.getCore().byId("pathSimGeo");

                    let match = true;

                    this.setType(sap.m.ListType.Inactive);

                    if (this.getTitle().startsWith("Load File")) {
                      if (!(fileInput.getValue().startsWith("/eos") || fileInput.getValue().startsWith("/store"))) {
                        let sValue = fileInput.getValue();

                        let oDialog = new sap.m.Dialog({
                          title: "Invalid Path",
                          type: "Message",
                          content: new sap.m.Text({ text: "The input path \"" + sValue + "\" is invalid.\nIt must start with /eos/ or /store." }),
                          beginButton: new sap.m.Button({
                            text: "OK",
                            press: function () {
                              oDialog.close();
                            }
                          }),
                          afterClose: function () {
                            oDialog.destroy(); // clean up
                          }
                        });

                        oDialog.setContentHeight("200px");
                        oDialog.open();
                        return;

                      }
                    }

                    if (this.getTitle() == "Load File EOS") {
                      path += encodeURIComponent(fileInput.getValue());

                      // check experimental port only for EOS and AAA
                      if (oRadioGroup.getSelectedIndex() === 1) {
                        path += "&port=";
                        path += encodeURIComponent(6677);
                      }
                    }
                    else if (this.getTitle() == "Load File AAA") {
                      path = "https://MACHINE/cmsShowWeb/revetor-frontend.pl?load_file_aaa=";
                      path += encodeURIComponent(fileInput.getValue());

                     // check experimental port only for EOS and AAA
                      if (oRadioGroup.getSelectedIndex() === 1) {
                        path += "&port=";
                        path += encodeURIComponent(6677);
                      }

                    }
                    else {
                      path = "https://MACHINE/cmsShowWeb/revetor-frontend.pl?load_sample=";
                      // path += "/data2/CMSSW_12_5_relval-samples/";
                      path += encodeURIComponent(this.getProperty("info"));
                    }

                    if (configInput.getValue()) {
                      path += "&fwconfig=";
                      path += encodeURIComponent(configInput.getValue());
                    }

                    if (geometryInput.getValue()) {
                      path += "&fwgeo=";
                      path += encodeURIComponent(geometryInput.getValue());
                    }

                    if (simGeoInput.getValue()) {
                      path += "&simgeo=";
                      path += encodeURIComponent(simGeoInput.getValue());
                    }
                    fileInput.setEnabled(false);
                    var oPage = sap.ui.getCore().byId("mainPage");
                   //oPage.setBusy(true);

var oBusy = new sap.m.BusyDialog({
    title: "Request Submitted",
    text: "Request submitted to the Fireworks Web service."
});

oBusy.open()

                    sap.m.URLHelper.redirect(path, false)
                    //  var oForm = document.forms[0];
                    //   oForm.Action.value = item.action;
                    //  oForm.submit();
                  }
                });
              })
            }) // top list



          ]
  });

  // =======================
  // SAMPLES
  // =======================
  let bpath = "https://MACHINE/cmsShowWeb/revetor-frontend.pl?load_sample=";
        var oRow1 = new sap.m.HBox({
          items: [
            new sap.m.Button({ text: "RelVal MuMu reco ", press: function (oEvent) { sap.m.URLHelper.redirect(bpath + "RelValMuMureco.root", false) } }),
            new sap.m.Button({ text: "RelVal MuMu miniaod", press: function (oEvent) { sap.m.URLHelper.redirect(bpath + "RelValMuMuMiniaod.root", false) } })
          ],
          justifyContent: "Start",
          renderType: "Bare"
        });

        // Second row
        var oRow2 = new sap.m.HBox({
          items: [
            new sap.m.Button({ text: "RelVal RecHit reco", press: function (oEvent) { sap.m.URLHelper.redirect(bpath + "RelValRecHitReco.root", false) } }),
            new sap.m.Button({ text: "RelVal ZTT minioad", press: function (oEvent) { sap.m.URLHelper.redirect(bpath + "RelValZTTMiniaod.root", false) } })
          ],
          justifyContent: "Start",
          renderType: "Bare"
        });

        var oRow3 = new sap.m.HBox({
          items: [
            new sap.m.Button({ text: "RelVal TTBar reco", press: function (oEvent) { sap.m.URLHelper.redirect(bpath + "RelValTTBarReco.root", false) } }),
            new sap.m.Button({ text: "RelVal ZEE miniaod", press: function (oEvent) { sap.m.URLHelper.redirect(bpath + "RelValZEEMiniaod.root", false) } })
          ],
          justifyContent: "Start",
          renderType: "Bare"
        });
        // Combine rows in a VBox
        var sampleList = new sap.m.VBox({
          items: [oRow1, oRow2, oRow3],
          renderType: "Bare" // optional: no extra wrapper padding
        });



  // =========================
  // RIGHT PANEL
  // =========================
  var oRightVBox = new sap.m.VBox({
    items: [
      new sap.m.Panel({
        headerText: "Advanced Options",
        expandable: true,
        expanded: true,

        content: [
          new sap.ui.core.HTML({ content: '<h4 class="cmsSubtitle">FireworksWeb Configuration</h4>' }),
          new sap.ui.layout.form.SimpleForm({
            editable: true,
            layout: "ResponsiveGridLayout",
            content: [
              new sap.m.Label({ text: "Configuration" }),
              configInput
            ]
          }),

          new sap.ui.core.HTML({ content: '<h4 class="cmsSubtitle">Geometry</h4>' }),
          new sap.ui.layout.form.SimpleForm({
            editable: true,
            layout: "ResponsiveGridLayout",
            content: [
              new sap.m.Label({ text: "Reco Geometry" }),
              geoInput
            ]
          }),

          new sap.ui.layout.form.SimpleForm({
            editable: true,
            layout: "ResponsiveGridLayout",
            content: [
              new sap.m.Label({ text: "Simulation Geometry" }),
              simGeoInput
            ]
          })
        ]}),
    new sap.ui.core.HTML({ content: '<br></br>' }),
            new sap.ui.core.HTML({ content: '<h3 class="cmsSubtitle">Predefined Test Samples</h3>' }),

            sampleList,
            new sap.ui.core.HTML({ content: '<br></br>' }),
            new sap.ui.core.HTML({ content: 'Status' })
    ]
  });


        var oLink1 = new sap.m.Link({
          text: "Mail to",
          href: "mailto:cmstalk+visualization@cern.ch",
          target: "cmstalk+visualization@cern.ch",
          layoutData: new sap.m.FlexItemData({ styleClass: "linkPadding" })
        });

        var oLink2 = new sap.m.Link({
          text: "CMS talk archive",
          href: "https://cms-talk.web.cern.ch/c/offcomp/visualization/165",
          layoutData: new sap.m.FlexItemData({ styleClass: "linkPadding" })
        });

        var oLink3 = new sap.m.Link({
          text: "Low level interface",
          href: "https://fireworks.cern.ch/cmsShowWeb/revetor.pl",
          layoutData: new sap.m.FlexItemData({ styleClass: "linkPadding" })
        });

  
  // Footer Bar with links
  var oFooter = new sap.m.Bar({
    contentMiddle: [
      new sap.m.HBox({
        //justifyContent: "SpaceBetween",
        items:
          [
            oLink1,

            new sap.m.Text({ text: " | " }),
            oLink2,

            new sap.m.Text({ text: " | " }),
            oLink3
          ]
      })
    ]
  });


  // =========================
  // PAGE
  // =========================
  var oPage = new sap.m.Page("mainPage", {
    showHeader: false,
    content: [oHeader, oLeftVBox, oRightVBox]
  });  
  
  oPage.setFooter(oFooter);

  new sap.m.Shell({ app: oPage }).placeAt("content");

});
</script>
